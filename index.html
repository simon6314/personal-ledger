<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的帳本</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <div class="top-row">
    <h1>我的帳本</h1>
    <button id="btnSettings" class="icon-btn" aria-label="設定">⚙</button>
  </div>
  <div class="top-row">
    <select id="monthSel" aria-label="選擇月份"></select>
    <button id="btnAdd" class="btn primary">＋ 新增</button>
  </div>
</header>

<main>
  <section class="summary">
    <div class="card"><span>收入</span><strong id="sumIncome" class="in">-</strong></div>
    <div class="card"><span>支出</span><strong id="sumExpense" class="out">-</strong></div>
    <div class="card"><span>結餘</span><strong id="sumBalance">-</strong></div>
    <div class="card"><span>轉帳（不計入）</span><strong id="sumTransfer" class="tr">-</strong></div>
  </section>
  <div id="sync" class="sync">載入中…</div>
  <section id="list" class="list"></section>
</main>

<!-- 新增／編輯紀錄 -->
<div id="recModal" class="modal hidden" role="dialog" aria-modal="true">
  <form id="recForm" class="sheet">
    <div class="sheet-head">
      <h2 id="recTitle">新增紀錄</h2>
      <button type="button" class="icon-btn" data-close="recModal" aria-label="關閉">✕</button>
    </div>
    <div class="seg" id="recType">
      <button type="button" data-type="支出" class="active">支出</button>
      <button type="button" data-type="收入">收入</button>
      <button type="button" data-type="轉帳">轉帳</button>
    </div>
    <label>日期<input type="date" id="recDate" required></label>
    <label>金額<input type="number" id="recAmount" inputmode="decimal" min="0" step="any" required></label>
    <label>項目<input type="text" id="recItem" placeholder="例如：午餐（轉帳可留空）"></label>
    <label id="lblAccount"><span id="lblAccountText">帳戶</span><select id="recAccount" required></select></label>
    <label id="lblToAccount" class="hidden">轉入帳戶<select id="recToAccount"></select></label>
    <label id="lblCategory">分類<input type="text" id="recCategory" list="catList" placeholder="例如：食物"></label>
    <datalist id="catList"></datalist>
    <label>備註<input type="text" id="recNote"></label>
    <div class="sheet-actions">
      <button type="button" id="recDelete" class="btn danger hidden">刪除</button>
      <button type="submit" id="recSave" class="btn primary">儲存</button>
    </div>
  </form>
</div>

<!-- 設定：帳戶管理 + token -->
<div id="setModal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="sheet">
    <div class="sheet-head">
      <h2>設定</h2>
      <button type="button" class="icon-btn" data-close="setModal" aria-label="關閉">✕</button>
    </div>
    <h3>帳戶管理</h3>
    <p class="hint">改名會同步更新所有交易；有交易使用的帳戶無法刪除。</p>
    <div id="accList"></div>
    <form id="accAddForm" class="acc-add">
      <input id="accNewName" placeholder="新帳戶名稱" required>
      <select id="accNewType" aria-label="類型">
        <option value="銀行">銀行</option>
        <option value="信用卡">信用卡</option>
        <option value="現金">現金</option>
        <option value="其他">其他</option>
      </select>
      <button class="btn primary" type="submit">新增</button>
    </form>
    <h3>存取碼</h3>
    <button id="btnForget" class="btn" type="button">清除這台裝置的存取碼</button>
  </div>
</div>

<!-- 輸入存取碼 -->
<div id="tokenModal" class="modal hidden" role="dialog" aria-modal="true">
  <form id="tokenForm" class="sheet">
    <div class="sheet-head"><h2>輸入存取碼</h2></div>
    <p class="hint">存取碼只會存在這台裝置的瀏覽器裡，不會放在網站程式碼中。</p>
    <p id="tokenErr" class="err hidden"></p>
    <input type="password" id="tokenInput" autocomplete="off" required>
    <div class="sheet-actions"><button class="btn primary" type="submit">確定</button></div>
  </form>
</div>

<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
</body>
</html>
